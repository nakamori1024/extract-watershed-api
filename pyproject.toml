[project]
name = "extract-watershed-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["api", "converter", "benchmark", "infra"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.71",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.mypy]
# rasterio does not ship type stubs; suppress import errors
[[tool.mypy.overrides]]
module = "rasterio.*"
ignore_missing_imports = true
