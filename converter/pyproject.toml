[project]
name = "converter"
version = "0.1.0"
description = "Convert J-FlwDir flow direction data to COG / Zarr formats"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "numpy>=2.5.1",
    "rasterio>=1.5.1",
    "zarr>=3.3.0",
]

[project.scripts]
jflwdir-convert = "converter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
